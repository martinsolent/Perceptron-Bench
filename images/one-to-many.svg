<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A single perceptron compared with a two-layer network that solves XOR">
<title>A single perceptron compared with a two-layer network that solves XOR</title><rect width="900" height="380" rx="14" fill="#ffffff"/>
<style>text{font-family:'DM Sans',Helvetica,Arial,sans-serif;fill:#1f2328} .m{font-family:'JetBrains Mono',Menlo,monospace} .mu{fill:#57606a}</style>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700">From one neuron to a network</text><text x="200" y="80" text-anchor="middle" font-size="16" font-weight="700">This bench: 1 neuron</text><line x1="110" y1="150" x2="270" y2="200" stroke="#57606a" stroke-width="1.6"/><line x1="110" y1="250" x2="270" y2="200" stroke="#57606a" stroke-width="1.6"/><circle cx="110" cy="150" r="26" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.4"/><text x="110" y="155" text-anchor="middle" font-size="13" font-weight="700">in</text><circle cx="110" cy="250" r="26" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.4"/><text x="110" y="255" text-anchor="middle" font-size="13" font-weight="700">in</text><circle cx="270" cy="200" r="26" fill="#fff8c5" stroke="#1f2328" stroke-width="1.4"/><text x="270" y="205" text-anchor="middle" font-size="13" font-weight="700">Σ</text><text x="200" y="320" text-anchor="middle" font-size="14" class="mu">One straight boundary.</text><text x="200" y="340" text-anchor="middle" font-size="14" class="mu">Can't solve XOR.</text><line x1="430" y1="70" x2="430" y2="360" stroke="#d0d7de" stroke-width="1.5"/><text x="680" y="80" text-anchor="middle" font-size="16" font-weight="700">Add a hidden layer</text><line x1="530" y1="150" x2="680" y2="150" stroke="#57606a" stroke-width="1.6"/><line x1="530" y1="150" x2="680" y2="250" stroke="#57606a" stroke-width="1.6"/><line x1="530" y1="250" x2="680" y2="150" stroke="#57606a" stroke-width="1.6"/><line x1="530" y1="250" x2="680" y2="250" stroke="#57606a" stroke-width="1.6"/><line x1="680" y1="150" x2="830" y2="200" stroke="#57606a" stroke-width="1.6"/><line x1="680" y1="250" x2="830" y2="200" stroke="#57606a" stroke-width="1.6"/><circle cx="530" cy="150" r="26" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.4"/><text x="530" y="155" text-anchor="middle" font-size="13" font-weight="700">in</text><circle cx="530" cy="250" r="26" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.4"/><text x="530" y="255" text-anchor="middle" font-size="13" font-weight="700">in</text><circle cx="680" cy="150" r="26" fill="#fff8c5" stroke="#1f2328" stroke-width="1.4"/><text x="680" y="155" text-anchor="middle" font-size="13" font-weight="700">OR</text><circle cx="680" cy="250" r="26" fill="#fff8c5" stroke="#1f2328" stroke-width="1.4"/><text x="680" y="255" text-anchor="middle" font-size="13" font-weight="700">AND</text><circle cx="830" cy="200" r="26" fill="#fff8c5" stroke="#1f2328" stroke-width="1.4"/><text x="830" y="205" text-anchor="middle" font-size="13" font-weight="700">Σ</text><text x="680" y="300" text-anchor="middle" font-size="12" class="mu">hidden neurons</text><text x="680" y="325" text-anchor="middle" font-size="14" class="mu">XOR = "OR, but not AND". Solved.</text><text x="680" y="345" text-anchor="middle" font-size="14" class="mu">Modern AI stacks millions of these.</text></svg>