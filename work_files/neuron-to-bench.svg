<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Diagram of a perceptron mapped to the parts of the bench">
<title>Diagram of a perceptron mapped to the parts of the bench</title><rect width="900" height="560" rx="14" fill="#ffffff"/>
<style>text{font-family:'DM Sans',Helvetica,Arial,sans-serif;fill:#1f2328} .m{font-family:'JetBrains Mono',Menlo,monospace} .mu{fill:#57606a}</style>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700">One perceptron, mapped to the bench</text><line x1="150" y1="100" x2="514" y2="225" stroke="#2f6fde" stroke-width="2.5"/><line x1="150" y1="150" x2="514" y2="225" stroke="#d0d7de" stroke-width="1.5"/><line x1="150" y1="200" x2="514" y2="225" stroke="#d0d7de" stroke-width="1.5"/><line x1="150" y1="300" x2="514" y2="225" stroke="#2f6fde" stroke-width="2.5"/><line x1="150" y1="350" x2="514" y2="225" stroke="#2f6fde" stroke-width="2.5"/><circle cx="120" cy="100" r="22" fill="#e5483e" stroke="#1f2328" stroke-width="1.2"/><text x="120" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">x₁</text><text x="60" y="105" text-anchor="end" class="m mu" font-size="13">1</text><circle cx="244.6" cy="132.5" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="244.6" y1="132.5" x2="250.6" y2="121.5" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="264.6" y="120.5" font-size="13" class="m">w₁</text><circle cx="120" cy="150" r="22" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.2"/><text x="120" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">x₂</text><text x="60" y="155" text-anchor="end" class="m mu" font-size="13">0</text><circle cx="244.6" cy="169.5" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="244.6" y1="169.5" x2="250.6" y2="158.5" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="264.6" y="157.5" font-size="13" class="m">w₂</text><circle cx="120" cy="200" r="22" fill="#f3d4d1" stroke="#1f2328" stroke-width="1.2"/><text x="120" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">x₃</text><text x="60" y="205" text-anchor="end" class="m mu" font-size="13">0</text><circle cx="244.6" cy="206.5" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="244.6" y1="206.5" x2="250.6" y2="195.5" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="264.6" y="194.5" font-size="13" class="m">w₃</text><circle cx="120" cy="300" r="22" fill="#e5483e" stroke="#1f2328" stroke-width="1.2"/><text x="120" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">x₁₅</text><text x="60" y="305" text-anchor="end" class="m mu" font-size="13">1</text><circle cx="244.6" cy="280.5" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="244.6" y1="280.5" x2="250.6" y2="269.5" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="264.6" y="302.5" font-size="13" class="m">w₁₅</text><circle cx="120" cy="350" r="22" fill="#e5483e" stroke="#1f2328" stroke-width="1.2"/><text x="120" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">x₁₆</text><text x="60" y="355" text-anchor="end" class="m mu" font-size="13">1</text><circle cx="244.6" cy="317.5" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="244.6" y1="317.5" x2="250.6" y2="306.5" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="264.6" y="339.5" font-size="13" class="m">w₁₆</text><text x="120" y="258" text-anchor="middle" font-size="22" class="mu">⋮</text><text x="60" y="78" text-anchor="end" class="mu" font-size="12">value</text><line x1="560" y1="110" x2="560" y2="179" stroke="#1f2328" stroke-width="1.5"/><circle cx="560" cy="96" r="15" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><line x1="560" y1="96" x2="554" y2="85" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/><text x="584" y="101" font-size="14" class="m">bias b</text><circle cx="560" cy="225" r="46" fill="#fff8c5" stroke="#1f2328" stroke-width="1.6"/><text x="560" y="237" text-anchor="middle" font-size="36">Σ</text><line x1="606" y1="225" x2="670" y2="225" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="175" width="150" height="100" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.2"/><text x="755" y="203" text-anchor="middle" font-size="14" font-weight="700">Is the total</text><text x="755" y="221" text-anchor="middle" font-size="14" font-weight="700">above zero?</text><text x="755" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fde">yes → X</text><text x="755" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#d9661c">no → O</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs><rect x="30" y="410" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="110.0" y="436" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" class="mu">INPUTS</text><text x="110.0" y="460" text-anchor="middle" font-size="15" font-weight="700">Switches + lights</text><rect x="205" y="410" width="265" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="337.5" y="436" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" class="mu">WEIGHTS</text><text x="337.5" y="460" text-anchor="middle" font-size="15" font-weight="700">Knobs + bias knob</text><rect x="480" y="410" width="390" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="675.0" y="436" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" class="mu">SUM &amp; DECISION</text><text x="675.0" y="460" text-anchor="middle" font-size="15" font-weight="700">Meter + verdict</text><text x="450" y="512" text-anchor="middle" font-size="13" class="mu">Lit inputs (1) pass their weight through to the sum; unlit inputs (0) contribute nothing.</text><text x="450" y="538" text-anchor="middle" font-size="15" class="m">output = w₁x₁ + w₂x₂ + … + w₁₆x₁₆ + b</text></svg>