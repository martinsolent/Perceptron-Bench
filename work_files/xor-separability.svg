<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" role="img" aria-label="AND and OR can be split by one line; XOR cannot">
<title>AND and OR can be split by one line; XOR cannot</title><rect width="900" height="465" rx="14" fill="#ffffff"/>
<style>text{font-family:'DM Sans',Helvetica,Arial,sans-serif;fill:#1f2328} .m{font-family:'JetBrains Mono',Menlo,monospace} .mu{fill:#57606a}</style>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700">Why XOR beats a single perceptron</text><text x="150" y="80" text-anchor="middle" font-size="17" font-weight="700">AND: both corners lit</text><rect x="30" y="100" width="240" height="240" fill="#f6f8fa" stroke="#d0d7de"/><line x1="130" y1="100" x2="270" y2="230" stroke="#1f2328" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="55" y="285" width="30" height="30" rx="4" fill="#d9661c"/><text x="70" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><rect x="215" y="285" width="30" height="30" rx="4" fill="#d9661c"/><text x="230" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><rect x="55" y="125" width="30" height="30" rx="4" fill="#d9661c"/><text x="70" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><circle cx="230" cy="140" r="16" fill="#2f6fde"/><text x="230" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><text x="150" y="368" text-anchor="middle" font-size="12" class="mu">top-left corner: off → on</text><text x="14" y="220" text-anchor="middle" font-size="12" class="mu" transform="rotate(-90 14 220)">bottom-right: off → on</text><text x="150" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">✓ One straight line works</text><text x="450" y="80" text-anchor="middle" font-size="17" font-weight="700">OR: at least one lit</text><rect x="330" y="100" width="240" height="240" fill="#f6f8fa" stroke="#d0d7de"/><line x1="330" y1="235" x2="465" y2="340" stroke="#1f2328" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="355" y="285" width="30" height="30" rx="4" fill="#d9661c"/><text x="370" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><circle cx="530" cy="300" r="16" fill="#2f6fde"/><text x="530" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><circle cx="370" cy="140" r="16" fill="#2f6fde"/><text x="370" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><circle cx="530" cy="140" r="16" fill="#2f6fde"/><text x="530" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><text x="450" y="368" text-anchor="middle" font-size="12" class="mu">top-left corner: off → on</text><text x="314" y="220" text-anchor="middle" font-size="12" class="mu" transform="rotate(-90 314 220)">bottom-right: off → on</text><text x="450" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">✓ One straight line works</text><text x="750" y="80" text-anchor="middle" font-size="17" font-weight="700">XOR: exactly one lit</text><rect x="630" y="100" width="240" height="240" fill="#f6f8fa" stroke="#d0d7de"/><line x1="630" y1="235" x2="765" y2="340" stroke="#e5483e" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/><line x1="730" y1="100" x2="870" y2="230" stroke="#e5483e" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/><rect x="655" y="285" width="30" height="30" rx="4" fill="#d9661c"/><text x="670" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><circle cx="830" cy="300" r="16" fill="#2f6fde"/><text x="830" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><circle cx="670" cy="140" r="16" fill="#2f6fde"/><text x="670" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text><rect x="815" y="125" width="30" height="30" rx="4" fill="#d9661c"/><text x="830" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✗</text><text x="750" y="368" text-anchor="middle" font-size="12" class="mu">top-left corner: off → on</text><text x="614" y="220" text-anchor="middle" font-size="12" class="mu" transform="rotate(-90 614 220)">bottom-right: off → on</text><text x="750" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#e5483e">✗ No single line can do it</text><text x="450" y="440" text-anchor="middle" font-size="14"><tspan fill="#2f6fde" font-weight="700">●</tspan> answer "yes"    <tspan fill="#d9661c" font-weight="700">■</tspan> answer "no"    A perceptron can only draw one straight boundary.</text></svg>